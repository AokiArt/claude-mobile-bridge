# claude 窗口状态色（钩子写窗口级选项 @ccstate/@ccnote）
# g=干活绿  y=中危待批黄  r=高危待批或被拒红  未设=空闲灰基线
# 〔note〕只在 y/r 状态渲染：tmux 对未知选项会展开成选项名本身，放外面会满屏〔@ccnote〕乱码
set -g status-interval 2
set -g mouse on   # 滚轮翻历史、鼠标点窗口/分屏、拖边框改大小
set -g status-style bg=colour235,fg=colour245
set -g window-status-format "#{?#{==:#{W:@ccstate},g},#[bg=colour22,fg=colour46],#{?#{==:#{W:@ccstate},y},#[bg=colour94,fg=colour220],#{?#{==:#{W:@ccstate},r},#[bg=colour52,fg=colour196],#[bg=colour235,fg=colour245]}}} #I:#W#{?#{||:#{==:#{W:@ccstate},y},#{==:#{W:@ccstate},r}},〔#{W:@ccnote}〕,} #[default]"
set -g window-status-current-format "#{?#{==:#{W:@ccstate},g},#[bg=colour22,fg=colour46],#{?#{==:#{W:@ccstate},y},#[bg=colour3,fg=colour16],#{?#{==:#{W:@ccstate},r},#[bg=colour1,fg=colour255],#[bg=colour238,fg=colour255]}}} #I:#W#{?#{||:#{==:#{W:@ccstate},y},#{==:#{W:@ccstate},r}},〔#{W:@ccnote}〕,} #[default]"
